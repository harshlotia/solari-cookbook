[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "journeyman-solari"
version = "0.1.0"
description = "AI-judged synthetic monitoring across Solari browsers, sandboxes, and desktops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "solari-browser>=0.1.3",
  "solari-sandbox>=0.2.0",
  "solari-desktop>=0.1.1",
  "Pillow>=10.0",
]

[project.optional-dependencies]
llm-judge = ["anthropic>=0.40"]

[project.scripts]
journeyman = "journeyman.cli:main"

[tool.setuptools]
packages = ["journeyman"]

[tool.setuptools.package-data]
journeyman = ["static/*.png"]
